# lightning.pytorch==2.1.0dev
seed_everything: true
trainer:
  accelerator: auto
  strategy: ddp_find_unused_parameters_true
  devices: auto
  num_nodes: 1
  precision: 32
  callbacks: null
  fast_dev_run: false
  max_epochs: 30
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 1
  enable_checkpointing: true
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0

model:
  pretrained_clip_url: openai/clip-vit-large-patch14
  vision_vq_config_path: model_conf/minecraft-vq-clip/vq_config.json
  warmup_steps: 50
  max_lr: 3.e-4
  min_lr: 5.e-6
  lr_gamma: 0.1
  lr_cycle_steps: 20000

  torch_compile: false
data:
  path_train: /131_data/jihwan/data/calvin_lmdb/ABCD
  path_val: /131_data/jihwan/data/calvin_lmdb/ABCD_val
  path_train_lmdb: /cvdata1/jihwan/calvin_lmdb/lmdb/ABCD
  path_val_lmdb: /cvdata1/jihwan/calvin_lmdb/lmdb/ABCD_val
  batch_size: 4096
ckpt_path: null
